sections:
  hero:
    type: shamim-digi-mobile::furniture-hero
    settings:
      image: /themes/shop/shamim-pack/images/pack-hero.png
      eyebrow: تولید و فروش تخصصی بسته‌بندی غذا
      heading: بسته‌بندی حرفه‌ای برای طعم‌های ماندگار
      description: جعبه و کاغذ استاندارد غذایی با طراحی کاربردی، قیمت همکاری و امکان چاپ اختصاصی برای رستوران، فست‌فود و کافه.
      button_text: مشاهده محصولات ←
      button_url: /search
      price: قیمت ویژه سفارش عمده
      badge_1_title: بسته‌بندی Food Grade
      badge_1_text: ایمن و مناسب تماس با غذا
      badge_2_title: چاپ اختصاصی برند
      badge_2_text: از طراحی تا تولید
  categories:
    type: shamim-digi-mobile::furniture-categories
    settings:
      eyebrow: دسترسی سریع
      heading: دسته‌بندی محصولات جعبه فروش
      description: دسته موردنظر را انتخاب کنید و مستقیم محصولات مرتبط را ببینید
    blocks:
      cups: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-cup.webp", title: لیوان یکبار مصرف, count: کاغذی و شفاف, url: "/disposable-cups" } }
      nuts: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-nuts.webp", title: بسته‌بندی آجیل, count: پاکت کرافت پنجره‌دار, url: "/nuts-packaging" } }
      icecream: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-icecream.webp", title: بسته‌بندی بستنی, count: کاپ بستنی و دسر, url: "/ice-cream-packaging" } }
      sachet: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-sachet.webp", title: بسته‌بندی ساشه, count: تک‌نفره و استیک‌پک, url: "/single-serve-sachets" } }
      takeaway: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-takeaway.webp", title: پاکت بیرون‌بر, count: کرافت دسته‌دار, url: "/takeaway-bags" } }
      cutlery: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-cutlery.webp", title: پک قاشق و چنگال, count: پک کامل بهداشتی, url: "/cutlery-packs" } }
      burger: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-burger.webp", title: جعبه برگر, count: کرافت فودگرید, url: "/burger-boxes" } }
      pizza: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-pizza.webp", title: جعبه پیتزا, count: همه سایزها, url: "/pizza-boxes" } }
      sandwich: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-sandwich.webp", title: جعبه ساندویچ, count: کرافت بیرون‌بر, url: "/sandwich-boxes" } }
      fried: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-fried.webp", title: جعبه سوخاری, count: سفید، مشکی و کرافت, url: "/fried-chicken-boxes" } }
      fries: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-fries.webp", title: جعبه سیب‌زمینی, count: قایقی، هرمی و صندوقی, url: "/french-fries-boxes" } }
      food: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-food.webp", title: جعبه غذا, count: گرم و بیرون‌بر, url: "/takeaway-food-boxes" } }
      bucket: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-bucket.webp", title: سطل سوخاری, count: تک‌نفره و خانواده, url: "/fried-chicken-buckets" } }
      tablecloth: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-tablecloth.webp", title: سفره, count: سرو بهداشتی غذا, url: "/disposable-tablecloths" } }
      pizza_board: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-pizza-board.webp", title: سینگل زیر پیتزا, count: مقوای دایره‌ای مقاوم, url: "/pizza-boards" } }
      disposable: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-disposable.webp", title: ظروف یکبار مصرف, count: درب‌دار و سرو غذا, url: "/disposable-food-containers" } }
      sandwich_paper: { type: category, settings: { image: "/themes/shop/shamim-pack/images/catalog-sandwich-paper.webp", title: کاغذ ساندویچ, count: کرافت مخصوص غذا, url: "/sandwich-wrapping-paper" } }
    blocks_order: [cups, nuts, icecream, sachet, takeaway, cutlery, burger, pizza, sandwich, fried, fries, food, bucket, tablecloth, pizza_board, disposable, sandwich_paper]
  products:
    type: shamim-digi-mobile::furniture-products
    settings:
      eyebrow: انتخاب حرفه‌ای‌ها
      heading: پرفروش‌ترین بسته‌بندی‌ها
      limit: 10
  story:
    type: shamim-digi-mobile::furniture-story
    settings:
      image: /themes/shop/shamim-pack/images/pack-kraft.png
      eyebrow: هویت برند شما روی بسته‌بندی
      heading: چاپ اختصاصی، از ایده تا تحویل
      description: تیم جعبه فروش برای انتخاب جنس، ابعاد، ساختار و چاپ کنار شماست؛ تا بسته‌بندی نهایی هم از غذا محافظت کند و هم برندتان را حرفه‌ای‌تر نشان دهد.
      button_text: دریافت مشاوره چاپ ←
      button_url: /contact-us
    blocks:
      experience: { type: stat, settings: { value: ۱۰+, label: سال تجربه تولید } }
      designs: { type: stat, settings: { value: ۲۵۰+, label: قالب و سایز آماده } }
      customers: { type: stat, settings: { value: ۹۸٪, label: رضایت مشتریان عمده } }
    blocks_order: [experience, designs, customers]
  editorial:
    type: shamim-digi-mobile::editorial-stories
    settings:
      eyebrow: انتخاب آگاهانه
      heading: راهنمای بسته‌بندی حرفه‌ای
    blocks:
      material:
        type: story
        settings:
          image: /themes/shop/shamim-pack/images/pack-burger.png
          category: راهنمای انتخاب
          title: برای غذای گرم چه جعبه‌ای مناسب‌تر است؟
          link_text: مطالعه راهنما ←
          url: /blog/entekhab-jabe-ghazaye-garm
      printing:
        type: story
        settings:
          image: /themes/shop/shamim-pack/images/pack-kraft.png
          category: چاپ و برندینگ
          title: بسته‌بندی چگونه فروش دوباره را بیشتر می‌کند؟
          link_text: مشاهده مطلب ←
          url: /blog/bastebandi-foroush-dobare
    blocks_order: [material, printing]
  quote:
    type: shamim-digi-mobile::quote-banner
    settings:
      quote: مشتری قبل از چشیدن غذا، کیفیت برند شما را از بسته‌بندی آن قضاوت می‌کند.
      cite: — جعبه فروش، همراه برندهای خوش‌طعم
  marquee:
    type: shamim-digi-mobile::furniture-marquee
    blocks:
      foodgrade: { type: item, settings: { text: مواد اولیه Food Grade } }
      custom: { type: item, settings: { text: چاپ اختصاصی برند } }
      wholesale: { type: item, settings: { text: قیمت همکاری و عمده } }
      sustainable: { type: item, settings: { text: محصولات کرافت پایدار } }
      shipping: { type: item, settings: { text: ارسال به سراسر ایران } }
    blocks_order: [foodgrade, custom, wholesale, sustainable, shipping]
  brands:
    type: shamim-digi-mobile::brand-strip
    settings:
      eyebrow: برای کسب‌وکار شما
      heading: بسته‌بندی مناسب هر مدل فروش غذا
    blocks:
      restaurant: { type: brand, settings: { name: رستوران } }
      fastfood: { type: brand, settings: { name: فست‌فود } }
      cafe: { type: brand, settings: { name: کافه } }
      catering: { type: brand, settings: { name: کترینگ } }
      bakery: { type: brand, settings: { name: قنادی } }
    blocks_order: [restaurant, fastfood, cafe, catering, bakery]
  benefits:
    type: shamim-digi-mobile::benefit-strip
    blocks:
      quality: { type: benefit, settings: { icon: "✓", title: کیفیت غذایی, description: مواد اولیه استاندارد } }
      wholesale: { type: benefit, settings: { icon: "٪", title: قیمت عمده, description: مناسب خرید سازمانی } }
      shipping: { type: benefit, settings: { icon: "🚚", title: ارسال سراسری, description: بسته‌بندی امن بار } }
      support: { type: benefit, settings: { icon: "☎", title: مشاوره تخصصی, description: انتخاب جنس و ابعاد } }
    blocks_order: [quality, wholesale, shipping, support]

order:
  - hero
  - categories
  - products
  - story
  - editorial
  - quote
  - marquee
  - brands
  - benefits
